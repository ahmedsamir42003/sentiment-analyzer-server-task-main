name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── TEST STAGE ──────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Lint
        run: bash scripts/lint.sh 

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: pip install uv
      - name: Run Tests
        run: uv run pytest test.server.py -v   # 👈 your file name

  # ── BUILD STAGE ─────────────────────────────
  build-image:
    runs-on: ubuntu-latest
    needs: [lint, unit-test]        # waits for test jobs to pass first
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} -p ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build Image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/sentiment-analyzer:latest .
      - name: Push Image
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/sentiment-analyzer:latest

  # ── DEPLOY STAGE ────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build-image              # waits for build to finish first
    steps:
      - uses: actions/checkout@v4
      - name: Install Lightning
        run: pip install lightning
      - name: Deploy to Lightning AI
        env:
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
          LIGHTNING_USERNAME: ${{ secrets.LIGHTNING_USERNAME }}
        run: python deploy.py
