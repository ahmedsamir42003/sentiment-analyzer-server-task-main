name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── TEST STAGE ──────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run Lint
        run: bash scripts/lint.sh

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run Tests
        run: uv run pytest tests/ -v 

  # ── BUILD STAGE ─────────────────────────────
  build-image:
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} -p ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build & Push Image
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/sentiment-analyzer:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/sentiment-analyzer:${{ github.sha }}

    # ── DEPLOY STAGE ────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v4
  
      - name: Install uv
        uses: astral-sh/setup-uv@v5
  
      - name: Install dependencies
        run: uv sync
  
      - name: Deploy to Lightning AI
        env:
          # Lightning Auth
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
          # deploy.py variables
          LIGHTNING_USERNAME: ${{ secrets.LIGHTNING_USERNAME }}
          TEAMSPACE: ${{ secrets.TEAMSPACE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          IMAGE_NAME: sentiment-analyzer
          CI_COMMIT_SHORT_SHA: ${{ github.sha }}   # 👈 GitHub equivalent of GitLab's variable
        run: uv run python deploy.py
