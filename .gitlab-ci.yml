stages:
    - test
    - build
    - deploy

lint:
  stage: test
  image: python:3.11
  script:
    - ./scripts/lint.sh

unit-test:
  stage: test
  image: python:3.11
  script:
    - pip install uv
    - uv run pytest -v

build-image:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker login -u $DOCKER_HUB_USERNAME -p $DOCKER_HUB_TOKEN
    - docker build -t $DOCKER_HUB_USERNAME/sentiment-analyzer:latest .
    - docker push $DOCKER_HUB_USERNAME/sentiment-analyzer:latest

deploy:
  stage: deploy
  image: python:3.10
  script:
    - pip install lightning
    - python deploy.py
  environment:
    name: production